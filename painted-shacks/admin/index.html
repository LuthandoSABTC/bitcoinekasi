<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painted Shacks Admin</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0b0a09; --panel:#151311; --raise:#1e1b18; --line:#2c2824;
  --fg:#f3efe9; --muted:#a59d93; --dim:#7a7268;
  --orange:#f7931a; --orange-ink:#1a0f00; --orange-soft:rgba(247,147,26,.14);
  --good:#4cc38a; --good-soft:rgba(76,195,138,.14);
  --warn:#e8b339; --warn-soft:rgba(232,179,57,.14);
  --bad:#ef6b5b; --bad-soft:rgba(239,107,91,.14);
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh}
a{color:var(--orange)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* Shell: sidebar on wide screens, bottom tabs on phones */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav.side{border-right:1px solid var(--line);background:var(--panel);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.brand img{width:36px;height:36px;border-radius:50%;background:#000}
.brand b{font:700 16px/1.1 var(--display)}
.brand small{display:block;color:var(--muted);font-size:12px}
.navbtn{display:flex;gap:10px;align-items:center;background:none;border:0;border-radius:10px;padding:10px 12px;color:var(--muted);font-weight:600;text-align:left;text-decoration:none}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn[aria-current="page"]{background:var(--orange-soft);color:var(--orange)}
.navbtn .badge{margin-left:auto}
.side .spacer{flex:1}
.who-am-i{font-size:12px;color:var(--dim);padding:8px 12px}
main{padding:24px clamp(16px,4vw,40px) 96px;max-width:980px;width:100%;min-width:0}
.tabbar{display:none}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav.side{display:none}
  main{padding:16px max(16px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:fixed;inset:auto 0 0 0;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
  .tabbar .navbtn{flex-direction:column;gap:2px;font-size:10px;padding:6px 0;justify-content:center;align-items:center;min-width:0}
  .tabbar .navbtn span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tabbar .navbtn .badge{display:none}
  .wbar{display:none!important}
}

/* Page parts */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font:700 26px/1.15 var(--display);margin:0}
h2{font:600 17px/1.2 var(--display);margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit;display:grid;gap:4px}
.stat .lbl{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.stat .val{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.stat.hero{background:var(--orange);color:var(--orange-ink);border-color:transparent}
.stat.hero .lbl{color:var(--orange-ink);opacity:.75}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--orange-soft);color:var(--orange);border-color:transparent}
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.item:last-child{border-bottom:0}
.item:hover{background:var(--raise)}
.item .main{flex:1;min-width:0}
.item b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:45%}
.no{width:42px;height:42px;border-radius:12px;background:var(--raise);display:grid;place-items:center;font:700 15px var(--mono);color:var(--orange);flex:none}
.pill{font:600 11px var(--body);padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--raise);color:var(--muted)}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-or{background:var(--orange-soft);color:var(--orange)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere}

/* Forms */
form.f{display:grid;gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.fld{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
label.fld.wide{grid-column:1/-1}
input[type=text],input[type=email],input[type=url],input[type=number],input[type=date],input[type=tel],input[type=password],input[type=search],select,textarea{
  width:100%;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--fg);font-size:15px;font-weight:400}
textarea{min-height:80px;resize:vertical}
input:invalid{border-color:var(--bad)}
.check{display:flex;gap:10px;align-items:center;font-weight:500;color:var(--fg);font-size:15px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.check input{width:20px;height:20px;accent-color:var(--orange)}
.hint{font-weight:400;color:var(--dim);font-size:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--orange);color:var(--orange-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--raise);color:var(--fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:wait}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100vw - 32px)}
.toast.err{background:var(--bad);color:#fff}
@media (min-width:761px){.toast{bottom:24px}}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}

/* Lesson preview (same look as the owner app) */
.lesson-pv h2{font-size:20px;margin:0 0 10px;line-height:1.25}
.lesson-pv h3{font-size:17px;margin:14px 0 6px}
.lesson-pv p{margin:0 0 12px}
.lesson-pv ul{margin:0 0 12px;padding-left:20px}
.lesson-pv .remember{background:#fdebd3;border-left:5px solid var(--orange);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-weight:600}
.lesson-pv figure{margin:0 0 12px}
.lesson-pv img{width:100%;height:auto;border-radius:10px;display:block}

/* Sign in */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .card{width:100%;max-width:380px}
.login img{width:64px;height:64px;border-radius:50%;background:#000;justify-self:center}
.login h1{text-align:center}
.demo-banner{background:var(--orange-soft);color:var(--orange);font:600 12px var(--mono);letter-spacing:.04em;text-align:center;padding:6px 12px}
@media print{body.print-pins nav.side,body.print-pins .tabbar,body.print-pins #main>*:not(#pinlist),body.print-pins #pinlist .btn,body.print-pins .toast{display:none!important}
  body.print-pins,body.print-pins .card{background:#fff!important;color:#000!important;border-color:#999!important}body.print-pins main{padding:0!important;margin:0!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ============================================================ helpers */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtSats = n => (Number(n) || 0).toLocaleString("en-ZA");
const fmtZar = n => n == null || n === "" ? "" : "R" + Number(n).toLocaleString("en-ZA", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-ZA", {day: "numeric", month: "short", year: "numeric"}) : "";
const LN_RE = /^[a-z0-9._+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i;
const LOGO = "logo.png";

const KIND = {for_profit: "For profit", non_profit: "Non profit", unaffiliated: "Unaffiliated", bitcoin_ekasi: "Bitcoin Ekasi"};
const PAY = {paying: "Paying", ongoing_in_kind: "Gives in kind", never_paid: "Never paid", lapsed: "Lapsed"};
const PAY_CLS = {paying: "p-good", ongoing_in_kind: "p-or", never_paid: "p-bad", lapsed: "p-warn"};
const STATUS = {painted: "Painted", needs_repaint: "Needs repaint", to_replace: "To replace", free_wall: "Free wall", removed: "Removed"};
const LANG = {xh: "isiXhosa", en: "English", af: "Afrikaans"};

function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.setAttribute("role", "status");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 2500);
}

/* ============================================================ data layer
   One interface, two backends: Supabase (real) and an in-memory demo. */
const TABLES = ["ps_shacks", "ps_owners", "ps_sponsors", "ps_sponsor_contacts", "ps_sponsor_payments", "ps_report_entries", "ps_partner_posts"];
const DEMO = !!window.PS_DEMO_DATA || new URLSearchParams(location.search).has("demo");
const cache = {};
const api = (t) => "/api/" + t.replace(/^ps_/, "");

async function call(method, url, body) {
  const res = await fetch(url, {method, credentials: "same-origin",
    headers: body !== undefined ? {"Content-Type": "application/json", "X-PS-Admin": "1"} : {"X-PS-Admin": "1"},
    body: body !== undefined ? JSON.stringify(body) : undefined});
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && !/\/api\/(login|password)$/.test(url)) { loginView("Your session ended. Please sign in again."); throw new Error("Please sign in."); }
  if (!res.ok) throw new Error(data.error || "Something went wrong (" + res.status + ").");
  return data;
}

const db = {
  async signIn(email, password) {
    if (DEMO) return {name: "Demo admin"};
    return call("POST", "/api/login", {email, password});
  },
  async me() {
    if (DEMO) return {name: "Demo admin"};
    const res = await fetch("/api/me", {credentials: "same-origin"});
    if (res.status === 401) return null;
    if (!res.ok) throw new Error("Could not reach the server.");
    const u = await res.json();
    if (u.role === "inspector") { location.replace("/inspect/"); return new Promise(() => {}); }
    if (u.role !== "admin") throw new Error("This account is not an admin.");
    return u;
  },
  async signOut() { if (!DEMO) await call("POST", "/api/logout", {}).catch(() => {}); location.hash = ""; location.reload(); },
  async loadAll() {
    if (DEMO) { const d = window.PS_DEMO_DATA || {}; TABLES.forEach(t => cache[t] = cache[t] || structuredClone(d[t] || [])); cache.inspections = cache.inspections || d.inspections || []; cache.inspection_photos = cache.inspection_photos || d.inspection_photos || []; return; }
    const d = await call("GET", "/api/data");
    TABLES.forEach(t => cache[t] = d[t.replace(/^ps_/, "")] || []);
    cache.inspections = d.inspections || []; cache.inspection_photos = d.inspection_photos || [];
    if (d.inspection_rules) RULES = d.inspection_rules;
  },
  async save(table, row) {
    const clean = {...row};
    Object.keys(clean).forEach(k => { if (clean[k] === "") clean[k] = null; });
    let data;
    if (DEMO) {
      data = clean.id ? Object.assign(cache[table].find(r => r.id === clean.id), clean) : {...clean, id: crypto.randomUUID(), created_at: new Date().toISOString()};
    } else {
      const {id, ...body} = clean;
      data = id ? await call("PATCH", api(table) + "/" + id, body) : await call("POST", api(table), body);
    }
    const i = cache[table].findIndex(r => r.id === data.id);
    if (i >= 0) cache[table][i] = data; else cache[table].push(data);
    return data;
  },
  async remove(table, id) {
    if (!DEMO) await call("DELETE", api(table) + "/" + id);
    cache[table] = cache[table].filter(r => r.id !== id);
  }
};
const byId = (t, id) => (cache[t] || []).find(r => r.id === id);
const shacksOf = ownerId => cache.ps_shacks.filter(s => s.owner_id === ownerId).sort((a, b) => a.shack_no - b.shack_no);
const ownerLabel = o => o ? (o.full_name || "Name not added yet") : "No owner linked";
const sponsorName = id => byId("ps_sponsors", id)?.name || "No logo set";

/* ============================================================ inspections */
let RULES = {every_days: 90, due_soon_days: 14};
const RESULT = {good: ["Good", "p-good"], touch_up: ["Needs attention", "p-warn"], repaint: ["Needs repaint", "p-bad"]};
const ANSWER = {good: "Good", fading: "Fading", damaged: "Damaged", yes: "Yes", partly: "Partly", no: "No"};
const inspectionsOf = shackId => (cache.inspections || []).filter(i => i.shack_id === shackId);   // newest first (server order)
const lastInspection = shackId => inspectionsOf(shackId)[0];
const photosOf = inspId => (cache.inspection_photos || []).filter(p => p.inspection_id === inspId);
const saToday = () => new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 10);
function inspectionDue(s) {
  if (s.status === "removed") return "ok";
  const last = lastInspection(s.id);
  if (!last) return "overdue";
  const due = new Date(Date.parse(last.inspected_on + "T00:00:00Z") + RULES.every_days * 864e5).toISOString().slice(0, 10);
  return due <= saToday() ? "overdue" : "ok";
}
const hasPhoto = s => !!s.photo_url || (cache.inspections || []).some(i => i.shack_id === s.id && photosOf(i.id).length);

/* ============================================================ what needs fixing */
function issuesFor(kind, r) {
  const out = [];
  if (kind === "owner") {
    if (!r.full_name) out.push("No name");
    if (!r.lightning_address) out.push("No Lightning address");
    if (!r.phone) out.push("No phone");
  }
  if (kind === "shack") {
    if (!r.owner_id) out.push("No owner");
    if (!hasPhoto(r)) out.push("No photo");
    if (r.needs_maintenance) out.push("Needs maintenance");
  }
  return out;
}

/* ============================================================ icons */
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  shack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6"/><path d="M5 9v11h14V9"/><rect x="9" y="13" width="6" height="7"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 13h2M3 10h18"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>'
};
const NAV = [["home", "Overview", I.home], ["shacks", "Shacks", I.shack], ["owners", "Owners", I.user], ["sponsors", "Sponsors", I.star], ["funding", "Funding", I.wallet]];

/* ============================================================ shell */
let me = null;
function shell(active, body) {
  const todo = cache.ps_owners.filter(o => issuesFor("owner", o).length).length;
  const links = cls => NAV.map(([k, label, icon]) =>
    `<a class="navbtn" href="#/${k}" ${active === k ? 'aria-current="page"' : ""}>${icon}<span>${label}</span>${k === "owners" && todo ? `<span class="pill p-warn badge">${todo}</span>` : ""}</a>`).join("");
  $("#app").innerHTML = `
    ${DEMO ? '<div class="demo-banner">PREVIEW: changes are not saved to the database</div>' : ""}
    <div class="shell">
      <nav class="side" aria-label="Main">
        <div class="brand"><img src="${LOGO}" alt=""><div><b>Painted Shacks</b><small>Admin</small></div></div>
        ${links()}
        <div class="spacer"></div>
        <a class="navbtn" href="#/settings" ${active === "settings" ? 'aria-current="page"' : ""}>${I.gear}<span>Settings</span></a>
        <div class="who-am-i">Signed in as ${esc(me?.name)}</div>
        <button class="navbtn" id="signout">${I.out}<span>Sign out</span></button>
      </nav>
      <main id="main">${body}</main>
      <nav class="tabbar" aria-label="Main">${links()}</nav>
    </div>`;
  $("#signout")?.addEventListener("click", db.signOut);
  window.scrollTo(0, 0);
}

/* ============================================================ pages */
const pages = {};

pages.home = () => {
  const S = cache.ps_shacks, O = cache.ps_owners, P = cache.ps_sponsor_payments, SP = cache.ps_sponsors;
  const noName = O.filter(o => !o.full_name).length;
  const noLn = O.filter(o => !o.lightning_address).length;
  const maint = S.filter(s => s.needs_maintenance).length;
  const noPhoto = S.filter(s => !hasPhoto(s)).length;
  const overdue = S.filter(s => inspectionDue(s) === "overdue").length;
  const month = saToday().slice(0, 7);
  const inspectedMonth = new Set((cache.inspections || []).filter(i => i.inspected_on.startsWith(month)).map(i => i.shack_id)).size;
  const sats = P.reduce((a, p) => a + Number(p.amount_sats || 0), 0);
  const payingCount = SP.filter(s => s.payment_status === "paying").length;
  const upcoming = P.filter(p => p.renews_on).sort((a, b) => a.renews_on.localeCompare(b.renews_on))[0];
  shell("home", `
    <div class="head"><div><h1>Overview</h1><p class="sub">Live numbers from the database.</p></div>

/* ---------- Shacks */
let shackFilter = "all", shackQuery = "";
pages.shacks = params => {
  if (params.get("f")) shackFilter = params.get("f");
  const filters = [["all", "All"], ["maint", "Needs maintenance"], ["overdue", "Inspection overdue"], ["nophoto", "No photo"], ["noowner", "No owner"]];
  const draw = () => {
    const q = shackQuery.toLowerCase();
    const rows = cache.ps_shacks.slice().sort((a, b) => a.shack_no - b.shack_no).filter(s => {
      const o = byId("ps_owners", s.owner_id);
      if (shackFilter === "maint" && !s.needs_maintenance) return false;
      if (shackFilter === "nophoto" && hasPhoto(s)) return false;
      if (shackFilter === "overdue" && inspectionDue(s) !== "overdue") return false;
      if (shackFilter === "noowner" && s.owner_id) return false;
      if (!q) return true;
      return [s.shack_no, sponsorName(s.sponsor_id), o?.full_name, o?.lightning_address, s.area].join(" ").toLowerCase().includes(q);
    });
    $("#rows").innerHTML = rows.length ? rows.map(s => {
      const o = byId("ps_owners", s.owner_id), li = lastInspection(s.id);
      return `<a class="item" href="#/shack/${s.id}"><span class="no">${s.shack_no}</span>
        <div class="main"><b>${esc(sponsorName(s.sponsor_id))}</b><small>${esc(ownerLabel(o))}${o?.lightning_address ? " · " + esc(o.lightning_address) : ""}</small>
          <small>${li ? `Inspected ${fmtDate(li.inspected_on)}: ${RESULT[li.result][0]}` : "Never inspected"}</small></div>
        <div class="end">${s.needs_maintenance ? '<span class="pill p-warn">Maintenance</span>' : ""}${s.status !== "painted" ? `<span class="pill">${STATUS[s.status]}</span>` : ""}${inspectionDue(s) === "overdue" ? '<span class="pill p-bad">Inspection due</span>' : ""}${!hasPhoto(s) ? '<span class="pill p-bad">No photo</span>' : ""}</div></a>`;
    }).join("") : '<div class="empty">No shacks match.</div>';
    $("#count").textContent = `${rows.length} of ${cache.ps_shacks.length}`;
  };
  shell("shacks", `
    <div class="head"><div><h1>Shacks</h1><p class="sub" id="count"></p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn ghost" href="#/sections">Sections and map</a><a class="btn" href="#/shack/new">Add shack</a></div></div>
    <div class="toolbar"><input type="search" id="q" placeholder="Search number, logo, owner, address" value="${esc(shackQuery)}" aria-label="Search shacks"></div>
    <div class="chips" style="margin-bottom:12px" role="group" aria-label="Filter">${filters.map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${shackFilter === k}">${l}</button>`).join("")}</div>
    <div class="list" id="rows"></div>`);
  $("#q").addEventListener("input", e => { shackQuery = e.target.value; draw(); });
  document.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
    shackFilter = b.dataset.f; document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw();
  }));
  draw();
};

function inspectionHistory(s) {
  const list = inspectionsOf(s.id);
  const due = inspectionDue(s);
  return `<div class="card" id="inspections">
    <div class="head" style="margin:0"><div><h2>Inspections</h2><p class="sub">${list.length ? `Every ${RULES.every_days} days. ${due === "overdue" ? "Next one is overdue." : ""}` : "Not inspected yet."}</p></div>
      <a class="btn ghost small" href="/inspect/#/inspect/${esc(s.id)}">Inspect now</a></div>
    ${list.map(i => {
      const ph = photosOf(i.id);
      return `<div class="insp" style="border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${fmtDate(i.inspected_on)}</b><span class="pill ${RESULT[i.result][1]}">${RESULT[i.result][0]}</span>
          <span class="muted" style="font-size:13px">by ${esc(i.inspector_name || "unknown")}</span>
          <button class="btn danger small" type="button" data-del-insp="${esc(i.id)}" style="margin-left:auto">Delete</button></div>
        <div class="muted" style="font-size:14px">Paint: <b>${ANSWER[i.paint]}</b> · Logo visible: <b>${ANSWER[i.logo]}</b></div>
        ${i.notes ? `<div style="font-size:14px">${esc(i.notes)}</div>` : ""}
        ${ph.length ? `<div style="display:flex;gap:8px;overflow-x:auto">${ph.map(p => `<a href="/api/photos/${esc(p.id)}" target="_blank" rel="noopener"><img src="/api/photos/${esc(p.id)}" alt="${esc(p.label || "Inspection")} photo" loading="lazy" style="width:120px;height:120px;object-fit:cover;border-radius:10px;background:var(--raise)"></a>`).join("")}</div>` : ""}
        ${i.photo_count > ph.length ? `<div class="muted" style="font-size:13px">${i.photo_count - ph.length} photo(s) still uploading from the inspector's phone.</div>` : ""}
      </div>`;
    }).join("")}
  </div>`;
}
function bindInspectionHistory() {
  document.querySelectorAll("[data-del-insp]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("Delete this inspection and its photos? This cannot be undone.")) return;
    try {
      if (!DEMO) await call("DELETE", "/api/inspections/" + b.dataset.delInsp);
      await db.loadAll(); toast("Inspection deleted"); route();
    } catch (err) { toast(friendlyError(err), true); }
  }));
}

/* ---------- shared form wiring */
function bindForm(table, row, toRow, afterSave, afterDelete, confirmText) {
  const form = $("#form");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const btn = form.querySelector("[type=submit]");
    const f = {};
    new FormData(form).forEach((v, k) => f[k] = v);
    form.querySelectorAll("input[type=checkbox]").forEach(c => f[c.name] = c.checked);
    btn.disabled = true;
    try {
      const data = toRow(f);
      if (row.id) data.id = row.id;
      const saved = await db.save(table, data);
      toast("Saved");
      const next = await (typeof afterSave === "function" ? afterSave(saved, f) : afterSave);
      if (location.hash === next) route(); else location.hash = next;
    } catch (err) {
      toast(friendlyError(err), true);
    } finally { btn.disabled = false; }
  });
  $("#del")?.addEventListener("click", async () => {
    if (!confirm(confirmText)) return;
    try { await db.remove(table, row.id); toast("Deleted"); location.hash = afterDelete; }
    catch (err) { toast(friendlyError(err), true); }
  });
}
function friendlyError(err) {
  const m = err?.message || String(err);
  if (/duplicate key.*shack_no/i.test(m)) return "That shack number is already used.";
  if (/ps_owners_lnaddr_uq|duplicate key.*lightning/i.test(m)) return "Another owner already has that Lightning address.";
  if (/duplicate key.*name/i.test(m)) return "A sponsor with that name already exists.";
  if (/violates row-level security|permission denied/i.test(m)) return "You don't have permission to change this.";
  if (/foreign key/i.test(m)) return "This is still linked to other records (for example payments). Remove those first.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "No connection. Check your internet and try again.";
  return m;
}

let mapCfg = null;
function sectionNames() {
  const names = new Map();
  for (const m of mapCfg?.sections || []) names.set(m.name.toLowerCase(), m.name);
  for (const s of cache.ps_shacks || []) { const a = (s.area || "").trim(); if (a && !names.has(a.toLowerCase())) names.set(a.toLowerCase(), a); }
  return [...names.values()];
}
// "-34.1712, 22.1034" or a Google Maps link with @-34.1712,22.1034 or ?q=-34.17,22.10
function parsePlace(v) {
  const t = String(v || "").trim();
  if (!t) return { lat: null, lng: null };
  const m = t.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) || t.match(/[?&](?:q|query|center|ll)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) || t.match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) throw new Error(`"${t}" doesn't look like a place. Paste the two numbers from Google Maps, like -34.1712, 22.1034`);
  return { lat: Number(m[1]), lng: Number(m[2]) };
}
// "1-29, 33, 40" -> [1..29, 33, 40]
function parseNumbers(v) {
  const out = new Set();
  for (const part of String(v || "").split(/[,\s]+/).filter(Boolean)) {
    const r = part.match(/^(\d+)(?:-(\d+))?$/);
    if (!r) throw new Error(`"${part}" is not a shack number or range like 1-29.`);
    const a = Number(r[1]), b = Number(r[2] || r[1]);
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) out.add(i);
  }
  return out;
}

      const missing = [...nos].filter(n => !shacks.some(s => s.shack_no === n));
      toast(`${hit.length} shack${hit.length === 1 ? "" : "s"} put in ${sec || "Not set"}. Press Save sections to keep it.` + (missing.length ? ` No shack ${missing.slice(0, 5).join(", ")}${missing.length > 5 ? "…" : ""}.` : ""));
    } catch (err) { toast(err.message, true); }
  });
  $("#areaf").addEventListener("submit", async e => {
    e.preventDefault(); const btn = e.submitter || e.target.querySelector("button[type=submit]"); btn.disabled = true;
    try {
      if (DEMO) throw new Error("Not available in the preview.");
      const areas = {};
      for (const s of shacks) if ((s.area || "").trim() !== pending.get(s.id)) areas[s.id] = pending.get(s.id);
      if (!Object.keys(areas).length) { toast("Nothing changed."); return; }
      const r = await call("POST", "/api/shacks/areas", { areas });
      await db.loadAll(); toast(`Saved. ${r.changed} shack${r.changed === 1 ? "" : "s"} changed.`); route();
    } catch (err) { toast(friendlyError(err), true); } finally { btn.disabled = false; }
  });
  $("#addsec").addEventListener("click", () => $("#secrows").insertAdjacentHTML("beforeend", secRow(null)));
  $("#secrows").addEventListener("click", e => { if (e.target.closest("[data-del]")) e.target.closest(".secrow").remove(); });
  $("#mapf").addEventListener("submit", async e => {
    e.preventDefault(); const btn = e.submitter || e.target.querySelector("button[type=submit]"); btn.disabled = true;
    try {
      if (DEMO) throw new Error("Not available in the preview.");
      const sections = [...document.querySelectorAll(".secrow")].map(r => ({ name: r.querySelector("[name=sname]").value.trim(), ...parsePlace(r.querySelector("[name=splace]").value), radius_m: Number(r.querySelector("[name=sradius]").value) || 100 }))
        .filter(x => x.name || x.lat != null);
      mapCfg = await call("PUT", "/api/dashboard-map", { place_name: e.target.place_name.value, sections });
      toast("Map saved. The public dashboard shows it within a minute."); drawRows();
    } catch (err) { toast(friendlyError(err), true); } finally { btn.disabled = false; }
  });
  drawRows();
};

/* ============================================================ public report (/dashboard)

const CATS = {paint: "Paint and upkeep", donation: "Donation", other: "Other"};

  shell("funding", `
    <a class="back" href="#/funding">${I.back}Funding</a>
    <div class="head"><div><h1>Public report</h1><p class="sub">What partners see at <a href="/dashboard/" target="_blank" rel="noopener">${esc(location.host)}/dashboard</a>. Everything on this page is public.</p></div></div>
    <form class="card f" id="repf">
      <h2>Report details</h2>
      <p class="muted" style="margin:0">Leave a box empty to keep the draft's sample text on the page. Type 0 to show nothing.</p>
      <div class="fields">
        ${num("agreements_signed", "Signed agreements this year")}
        <label class="fld">Blank agreement link<input type="url" name="agreement_url" value="${esc(R.agreement_url)}" placeholder="https://"><span class="hint">The unsigned agreement in English and isiXhosa. Never a signed copy.</span></label>
        ${num("pending_walls", "Walls: payment pending")}
        <label class="fld">What it means<input type="text" name="pending_note" maxlength="200" value="${esc(R.pending_note)}" placeholder="Said yes for ${year}, invoice sent."></label>
        ${num("review_walls", "Walls: under review")}
        <label class="fld">What it means<input type="text" name="review_note" maxlength="200" value="${esc(R.review_note)}" placeholder="Being talked through with the logo's owner."></label>
        <label class="fld wide">Questions to settle before it goes public (one per line)<textarea name="questions" rows="7">${esc((R.questions || []).join("\n"))}</textarea><span class="hint">Leave empty to hide this list.</span></label>
        <label class="check fld wide"><input type="checkbox" name="show_draft_note" ${R.show_draft_note !== false ? "checked" : ""}> Show the "Draft for the team" note at the top</label>
      </div>
      <div class="actions"><button class="btn" type="submit">Save report details</button></div>
      ${R.updated_by ? `<p class="hint" style="margin:0">Last changed by ${esc(R.updated_by)}${R.updated_at ? " on " + fmtDate(R.updated_at.slice(0, 10)) : ""}.</p>` : ""}
    </form>
    <div class="card"><div class="head" style="margin:0"><h2>Costs and other money in</h2><a class="btn small" href="#/entry/new">Add line</a></div>
      <p class="muted" style="margin:0">${year} only. Paint and donations. The first line turns on the real money section of the report. Sponsor payments (Funding) and payouts to families are added to the report by the app, so don't type them here.</p>
      <div class="scroll"><table class="t"><thead><tr><th>Date</th><th>What for</th><th>Kind</th><th class="r">In</th><th class="r">Out</th><th>Proof</th></tr></thead><tbody>
        ${E.map(e => `<tr><td><a href="#/entry/${e.id}">${fmtDate(e.entry_date)}</a></td><td>${esc(e.what)}</td><td>${esc(CATS[e.category] || "Other")}</td>
          <td class="r num">${e.direction === "in" ? fmtSats(e.amount_sats) : ""}</td><td class="r num">${e.direction === "out" ? fmtSats(e.amount_sats) : ""}</td>
          <td>${e.proof_url ? `<a href="${esc(e.proof_url)}" target="_blank" rel="noopener">Link</a>` : ""}</td></tr>`).join("") || '<tr><td colspan="6" class="muted">No lines yet. The report shows the draft\'s sample costs until you add one.</td></tr>'}
      </tbody></table></div></div>
    <div class="card"><h2>Partner video posts</h2>
      <p class="muted" style="margin:0">Add the video post, its links and reach on each sponsor's page: ${cache.ps_sponsors.filter(x => x.payment_status === "paying").map(x => `<a href="#/sponsor/${x.id}">${esc(x.name)}</a>`).join(", ") || "no paying sponsors yet"}. Missing one? Set its payment status to Paying on its page.</p></div>`);
  $("#repf").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = e.target.querySelector("[type=submit]"), f = Object.fromEntries(new FormData(e.target));
    const body = {...f, show_draft_note: e.target.show_draft_note.checked, questions: f.questions.split("\n")};
    btn.disabled = true;
    try { reportCfg = DEMO ? {...R, ...body, questions: body.questions.filter(q => q.trim())} : await call("PUT", "/api/report-settings", body); toast("Saved"); pages.report(); }
    catch (err) { toast(friendlyError(err), true); } finally { btn.disabled = false; }

    <form class="card f" id="form"><div class="fields">

/* ============================================================ router */
function route() {
  const [path, qs] = (location.hash.slice(2) || "home").split("?");
  const [page, id] = path.split("/");
  const params = new URLSearchParams(qs || "");
  const fn = pages[page];
  if (!fn) return pages.home(params);
  id ? fn(id, params) : fn(params);
}

/* ============================================================ sign in + start */
function loginView(msg) {
  $("#app").innerHTML = `<div class="login"><form class="card f" id="login">
      <img src="${LOGO}" alt="Bitcoin Ekasi">
      <h1>Painted Shacks Admin</h1>
      ${msg ? `<div class="note">${esc(msg)}</div>` : ""}
      <label class="fld">Email<input type="email" name="email" required autocomplete="username"></label>
      <label class="fld">Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit" style="justify-content:center">Sign in</button>
    </form></div>`;
  $("#login").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true;
    const f = new FormData(e.target);
    try { me = await db.signIn(f.get("email"), f.get("password")); if (me.role === "inspector") return location.replace("/inspect/"); await start(); }
    catch (err) { loginView(friendlyError(err)); }
  });
}
async function start() {
  $("#app").innerHTML = '<div class="login"><p class="muted">Loading…</p></div>';
  try { await db.loadAll(); }
  catch (err) { $("#app").innerHTML = `<div class="login"><div class="card"><h1>Could not load data</h1><p class="note">${esc(friendlyError(err))}</p><button class="btn" onclick="location.reload()">Try again</button></div></div>`; return; }
  window.addEventListener("hashchange", route);
  route();
}
// Starts once every script on the page (including payments.js) has loaded.
document.addEventListener("DOMContentLoaded", async function boot() {
  if (DEMO) { me = {name: "Demo admin"}; return start(); }
  try { me = await db.me(); } catch (err) { return loginView(err.message); }
  me ? start() : loginView();
});
