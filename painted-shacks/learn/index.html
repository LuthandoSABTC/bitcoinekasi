<!doctype html>
<html lang="xh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7931a">
<title>Funda i-Bitcoin · Painted Shacks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#fbf7f1; --card:#ffffff; --line:#e8dfd3; --fg:#1d1812; --muted:#6b6156;
  --orange:#f7931a; --orange-deep:#c76a00; --orange-soft:#fdebd3; --ink:#1a0f00;
  --good:#1f8a5a; --good-soft:#dcf3e8; --bad:#c0392b; --bad-soft:#fbe2de; --lock:#b8ada0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--orange-deep)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:10px;padding:10px 0 14px}
header.top img{width:40px;height:40px;border-radius:50%;background:#000;flex:none}
header.top .t{flex:1;min-width:0}
header.top b{display:block;font-size:17px;line-height:1.2}
header.top small{color:var(--muted);font-size:13px}
.lang{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font-weight:600;padding:8px 0;text-decoration:none}
h1{font-size:24px;line-height:1.2;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.hero{background:var(--orange);border-color:transparent;color:var(--ink)}
.hero h2{color:var(--ink);opacity:.7}
.big{font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px}
.bar i{height:12px;border-radius:6px;background:rgba(26,15,0,.18)}
.bar i.on{background:var(--ink)}
.muted{color:var(--muted)}
.btn{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;border:0;border-radius:14px;padding:16px 18px;font-weight:700;font-size:18px;background:var(--orange);color:var(--ink);text-decoration:none;min-height:56px}
.btn.dark{background:var(--fg);color:#fff}
.btn.ghost{background:var(--card);border:2px solid var(--line);color:var(--fg)}
.btn:disabled{opacity:.55}
.row{display:flex;gap:10px}
.row>*{flex:1}
.lesson-now .wk{font-weight:700;color:var(--orange-deep);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.lesson-now h3{font-size:21px;margin:2px 0 14px;line-height:1.25}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
.dots span{aspect-ratio:1;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.dots span.done{background:var(--good);color:#fff}
.dots span.now{background:var(--orange);color:var(--ink)}
.menu{display:grid;gap:10px}
.menu a{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--fg);font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.item:last-child{border-bottom:0}
.item .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--line);color:var(--muted);flex:none}
.item.done .n{background:var(--good);color:#fff}
.item.ready .n{background:var(--orange);color:var(--ink)}
.item .m{flex:1;min-width:0}
.item b{display:block;font-weight:600;line-height:1.3}
.item small{display:block;color:var(--muted);font-size:14px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}
.p-or{background:var(--orange-soft);color:var(--orange-deep)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.note{background:var(--orange-soft);color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600}
label.f{display:grid;gap:6px;font-weight:600;margin-bottom:14px}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=tel],input[type=password],select{width:100%;border:2px solid var(--line);border-radius:12px;padding:14px;font-size:20px;background:#fff}
input.pin{letter-spacing:.4em;font-variant-numeric:tabular-nums}
/* Lesson reading */
.page{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:14px;min-height:50vh}
.page h2{font-size:22px;line-height:1.25;margin:0 0 12px}
.page h3{font-size:19px;margin:18px 0 8px}
.page p{margin:0 0 14px}
.page ul{margin:0 0 14px;padding-left:22px}
.page li{margin-bottom:6px}
.page .remember{background:var(--orange-soft);border-left:5px solid var(--orange);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-weight:600}
.page figure.pic{margin:0 0 14px}
.page figure.pic img{width:100%;height:auto;border-radius:12px;display:block;background:var(--line)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 6px}
.prog i{display:block;height:100%;background:var(--orange);border-radius:4px}
.pageno{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:10px}
/* Quiz */
.choice{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font-size:17px;min-height:56px}
.choice .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--lock);flex:none}
.choice[aria-checked="true"]{border-color:var(--orange);background:var(--orange-soft)}
.choice[aria-checked="true"] .dot{border:7px solid var(--orange)}
.qtext{font-size:20px;font-weight:700;line-height:1.35;margin:0 0 16px}
.res{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;color:#fff}
.res .ok{background:var(--good)} .res .no{background:var(--bad)}
.center{text-align:center}
.celebrate{font-size:56px;line-height:1;margin:8px 0}
.login-logo{width:84px;height:84px;border-radius:50%;background:#000;display:block;margin:24px auto 12px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:15px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:20;max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted center" style="margin-top:40vh">…</p></div>
<script src="lesson-render.js"></script>
<script>
"use strict";
/* ============================================================ words (isiXhosa first, English second) */
const T = {
  xh: {
    app: "Funda i-Bitcoin", sub: "Painted Shacks · Bitcoin Ekasi",
    signin: "Ngena", who: "Ishack yakho", pick: "Khetha ishack yakho", use_phone: "Ngena ngenombolo yefowuni", use_list: "Khetha ishack yakho kuluhlu", phone: "Inombolo yefowuni yakho",
    pin: "I-PIN yakho", pin_hint: "Amanani ama-4 owanikwe ngumphathi", nopin: "Awunayo i-PIN? Cela umphathi weBitcoin Ekasi.", demo: "Zama isifundo somzekelo", demo_title: "Umzekelo", demo_pick: "Khetha isifundo uzame indlela i-app esebenza ngayo.", demo_note: "Lo ngumzekelo wokuziqhelanisa. Akukho nto igcinwayo, akukho sats zifumanekayo.", demo_passed: "Uphumelele kumzekelo! Xa izifundo ziqala, ufumana i-7,000 sats ngeveki nganye oyigqibayo.", demo_back: "Buyela ekungeneni", demo_none: "Akukho zifundo zomzekelo okwangoku.",
    hello: n => n ? `Molo, ${n}` : "Molo!", month: m => `Imali ka-${m}`, earned: "sats ozifumeneyo",
    of_max: (w, m, s) => `${w} kwiiveki ezi-${m} · ukuya kuthi ga kwi-${s} sats`, payday: d => `Ihlawulwa ngoLwesihlanu ${d}`,
    after_cut: d => `Iiveki ozigqibayo emva komhla we-${d} zibalelwa kwinyanga elandelayo.`,
    your_lesson: "Isifundo sakho", week: n => `Iveki ${n}`, start: "Qala ukufunda", cont: "Qhubeka ufunde", quiz: "Phendula imibuzo",
    starts: d => `Izifundo ziqala ngomhla we-${d}. Sobonana ngoko!`,
    wait: d => `Ugqibile isifundo sale veki. Enkosi! Isifundo esilandelayo sivula ngoMvulo, ${d}.`,
    soon: "Isifundo esilandelayo asikalungi. Siza kufika kungekudala.", alldone: "Ugqibe zonke izifundo. Halala! 🎉",
    progress: "Inkqubela yakho", weeks_of: (n, t) => `${n} kwi-${t} iiveki zigqityiwe`,
    all: "Zonke izifundo", money: "Imali yam", settings: "Useto", home: "Ekhaya",
    next: "Okulandelayo", prev: "Emva", page: (n, m) => `Iphepha ${n} kwa-${m}`, done_reading: "Ndigqibile ukufunda",
    quiz_intro: (n, k) => `Imibuzo eli-${n}. Phendula ezi-${k} ngokuchanekileyo ukuze uphumelele.`, quiz_start: "Qala imibuzo",
    question: (n, m) => `Umbuzo ${n} kwa-${m}`, send: "Thumela iimpendulo", choose_one: "Khetha impendulo",
    passed: "Uphumelele!", passed_sub: (m, s) => `Le veki igqityiwe. Iongezwe kwimali yakho ka-${m}: +${s} sats.`,
    passed_again: "Uphumelele kwakhona.", week_done: "Le veki igqityiwe.", failed: "Awukaphumeleli", failed_sub: (s, t, k) => `Ufumene ${s} kwi-${t}. Kufuneka ${k}. Funda isifundo kwakhona, uze uzame kwakhona.`,
    right: "Ichanekile", wrong: "Ayichanekanga", right_ans: "Impendulo echanekileyo:",
    read_again: "Funda kwakhona", try_again: "Zama kwakhona", go_home: "Buyela ekhaya",
    offline: "Akukho nethiwekhi. Zama kwakhona xa une-data.", s_done: "Igqityiwe", s_ready: "Ivulekile", s_wait: "Iveki ezayo",
    s_soon: "Ayikalungi", s_locked: "Ivaliwe", read_first: "Funda isifundo kuqala.",
    ln: "Idilesi yakho ye-Lightning", ln_help: "Iisats zakho zithunyelwa apha. Ukuba ayichanekanga, xelela umphathi.", ln_none: "Akukabikho dilesi. Xelela umphathi.",
    payouts: "Iintlawulo", no_payouts: "Akukabikho ntlawulo okwangoku.", st_paid: "Ihlawulwe", st_wait: "Ilinde ukuhlawulwa", st_failed: "Iyalungiswa",
    weeks_n: n => `iiveki ezi-${n}`, change_pin: "Tshintsha i-PIN", cur_pin: "I-PIN yangoku", new_pin: "I-PIN entsha (amanani ama-4)",
    save: "Gcina", saved: "Igciniwe", signout: "Phuma", lang: "English", shack: n => `Ishack ${n}`, loading: "Iyalayisha…",
  },
  en: {
    app: "Learn Bitcoin", sub: "Painted Shacks · Bitcoin Ekasi",
    signin: "Sign in", who: "Your shack", pick: "Choose your shack", use_phone: "Sign in with your phone number", use_list: "Choose your shack from the list", phone: "Your phone number",
    pin: "Your PIN", pin_hint: "The 4 numbers the admin gave you", nopin: "No PIN? Ask the Bitcoin Ekasi admin.", demo: "Try a practice lesson", demo_title: "Practice", demo_pick: "Choose a lesson to see how the app works.", demo_note: "This is practice. Nothing is saved and no sats are earned.", demo_passed: "You passed the practice! When lessons start, you earn 7,000 sats for each week you finish.", demo_back: "Back to sign in", demo_none: "No practice lessons yet.",
    hello: n => n ? `Hello, ${n}` : "Hello!", month: m => `${m} money`, earned: "sats earned",
    of_max: (w, m, s) => `${w} of ${m} weeks · up to ${s} sats`, payday: d => `Paid on Friday ${d}`,
    after_cut: d => `Weeks you finish after ${d} count for next month.`,
    your_lesson: "Your lesson", week: n => `Week ${n}`, start: "Start reading", cont: "Continue reading", quiz: "Answer the questions",
    starts: d => `Lessons start on ${d}. See you then!`,
    wait: d => `You finished this week's lesson. Thank you! The next lesson opens on Monday, ${d}.`,
    soon: "The next lesson is not ready yet. It's coming soon.", alldone: "You finished all the lessons. Well done! 🎉",
    progress: "Your progress", weeks_of: (n, t) => `${n} of ${t} weeks done`,
    all: "All lessons", money: "My money", settings: "Settings", home: "Home",
    next: "Next", prev: "Back", page: (n, m) => `Page ${n} of ${m}`, done_reading: "I finished reading",
    quiz_intro: (n, k) => `${n} questions. Get ${k} right to pass.`, quiz_start: "Start the questions",
    question: (n, m) => `Question ${n} of ${m}`, send: "Send answers", choose_one: "Choose an answer",
    passed: "You passed!", passed_sub: (m, s) => `This week is done. Added to your ${m} money: +${s} sats.`,
    passed_again: "You passed again.", week_done: "This week is done.", failed: "Not passed yet", failed_sub: (s, t, k) => `You got ${s} of ${t}. You need ${k}. Read the lesson again, then try again.`,
    right: "Right", wrong: "Wrong", right_ans: "Right answer:",
    read_again: "Read again", try_again: "Try again", go_home: "Back to home",
    offline: "No connection. Try again when you have data.", s_done: "Done", s_ready: "Open", s_wait: "Next week",
    s_soon: "Not ready", s_locked: "Locked", read_first: "Read the lesson first.",
    ln: "Your Lightning address", ln_help: "Your sats are sent here. If it's wrong, tell the admin.", ln_none: "No address yet. Tell the admin.",
    payouts: "Payments", no_payouts: "No payments yet.", st_paid: "Paid", st_wait: "Waiting to be paid", st_failed: "Being fixed",
    weeks_n: n => `${n} weeks`, change_pin: "Change PIN", cur_pin: "Current PIN", new_pin: "New PIN (4 numbers)",
    save: "Save", saved: "Saved", signout: "Sign out", lang: "isiXhosa", shack: n => `Shack ${n}`, loading: "Loading…",
  },
};
let lang = (() => { try { return localStorage.getItem("ps_lang") || "xh"; } catch (e) { return "xh"; } })();
const t = (k, ...a) => { const v = (T[lang] || T.xh)[k] ?? T.xh[k]; return typeof v === "function" ? v(...a) : v; };
const MONTHS = { xh: ["Janyuwari", "Februwari", "Matshi", "Epreli", "Meyi", "Juni", "Julayi", "Agasti", "Septemba", "Okthobha", "Novemba", "Disemba"],
                 en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"] };
const monthOf = period => MONTHS[lang][Number(period.slice(5, 7)) - 1];
const day = d => { const [, m, dd] = d.split("-").map(Number); return `${dd} ${MONTHS[lang][m - 1]}`; };
const sats = n => (Number(n) || 0).toLocaleString("en-ZA");

/* ============================================================ helpers */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = () => $("#app");
function toast(msg, bad) {
  const el = document.createElement("div"); el.className = "toast" + (bad ? " bad" : ""); el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), bad ? 5000 : 2500);
}
async function call(method, url, body) {
  let res;
  try {
    res = await fetch(url, { method, credentials: "same-origin", headers: body !== undefined ? { "Content-Type": "application/json", "X-PS-Admin": "1" } : { "X-PS-Admin": "1" },
      body: body !== undefined ? JSON.stringify(body) : undefined });
  } catch (e) { throw new Error(t("offline")); }
  let data = {}; try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && url !== "/api/learn/login") { loginView(); throw new Error(data.error || "Please sign in."); }
  if (!res.ok) throw new Error(pickLang(data.error) || t("offline"));
  return data;
}
// Server messages come as "English / isiXhosa" when they have both.
const pickLang = m => { if (!m || !m.includes(" / ")) return m; const [en, xh] = m.split(" / "); return lang === "xh" ? xh : en; };

function topBar(back) {
  return `<header class="top">${back ? `<a class="back" href="${back}">‹ ${t("prev")}</a><div class="t"></div>` :
    `<img src="logo.png" alt=""><div class="t"><b>${t("app")}</b><small>${t("sub")}</small></div>`}
    <button class="lang" id="lang" type="button">${t("lang")}</button></header>`;
}
function bindTop() {
  $("#lang")?.addEventListener("click", () => { lang = lang === "xh" ? "en" : "xh"; try { localStorage.setItem("ps_lang", lang); } catch (e) {} document.documentElement.lang = lang; route(); });
}
function render(html, back) { app().innerHTML = topBar(back) + html; bindTop(); window.scrollTo(0, 0); }
function fail(err) { render(`<div class="err">${esc(err.message)}</div><a class="btn ghost" href="#/">${t("go_home")}</a>`, "#/"); }

/* ============================================================ sign in */
function loginView(msg) {
  app().innerHTML = `${topBar()}
    <img class="login-logo" src="logo.png" alt="Bitcoin Ekasi">
    <h1 class="center">${t("signin")}</h1>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ""}
    <form id="login" class="card" autocomplete="on">
      <div id="whobox"></div>
      <label class="f">${t("pin")}<input class="pin" type="password" name="pin" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" required autocomplete="current-password"><small>${t("pin_hint")}</small></label>
      <button class="btn" type="submit">${t("signin")}</button>
    </form>
    <p class="muted center">${t("nopin")}</p>
    <a class="btn ghost" href="#/demo">${t("demo")}</a>`;
  bindTop();
  // Owners pick their shack from a list (or type their phone number instead).
  let saved = ""; try { saved = localStorage.getItem("ps_shack") || ""; } catch (e) {}
  const phoneBox = () => { $("#whobox").innerHTML = `<label class="f">${t("phone")}<input type="tel" name="who" inputmode="tel" required autocomplete="username"></label>
      <p class="center" style="margin:0 0 12px"><a href="#" id="uselist">${t("use_list")}</a></p>`;
    $("#uselist").addEventListener("click", e => { e.preventDefault(); listBox(); }); };
  const listBox = async () => {
    let shacks = [];
    try { shacks = (await call("GET", "/api/learn/shacks")).shacks; } catch (e) {}
    if (!shacks.length) return phoneBox();
    $("#whobox").innerHTML = `<label class="f">${t("who")}<select name="who" required autocomplete="username">
        <option value="">${t("pick")}</option>${shacks.map(s => `<option value="${s.no}" ${String(s.no) === saved ? "selected" : ""}>${esc(s.label)}</option>`).join("")}</select></label>
      <p class="center" style="margin:0 0 12px"><a href="#" id="usephone">${t("use_phone")}</a></p>`;
    $("#usephone").addEventListener("click", e => { e.preventDefault(); phoneBox(); });
  };
  listBox();
  $("#login").addEventListener("submit", async e => {
    e.preventDefault(); const f = new FormData(e.target), b = e.target.querySelector("button"); b.disabled = true;
    try { await call("POST", "/api/learn/login", { who: f.get("who"), pin: f.get("pin") });
      if (/^\d{1,4}$/.test(f.get("who"))) try { localStorage.setItem("ps_shack", f.get("who")); } catch (e) {}
      me = null; location.hash = "#/"; route(); }
    catch (err) { loginView(err.message); }
  });
}

/* ============================================================ pages */
let me = null;
async function loadMe(force) {
  if (!me || force) me = await call("GET", "/api/learn/me");
  // First visit: use the owner's lesson language from the admin app.
  let chosen = null; try { chosen = localStorage.getItem("ps_lang"); } catch (e) {}
  if (!chosen && me.language === "en" && lang !== "en") { lang = "en"; document.documentElement.lang = "en"; }
  return me;
}

async function home() {
  let m; try { m = await loadMe(true); } catch (e) { return; }
  const tm = m.this_month, cur = m.next_week ? m.weeks[m.next_week - 1] : null;
  let lessonCard;
  if (!cur) lessonCard = `<p style="margin:0;font-weight:600">${t("alldone")}</p>`;
  else if (cur.state === "ready") lessonCard = `<div class="wk">${t("week", cur.week_no)}</div><h3>${esc(cur.title)}</h3>
      <a class="btn" href="#/lesson/${cur.week_no}">${cur.read_done ? t("quiz") : t("start")}</a>`;
  else if (cur.state === "wait") lessonCard = `<div class="wk">${t("week", cur.week_no)}</div><p style="margin:0">${t(cur.week_no === 1 ? "starts" : "wait", day(cur.opens_on))}</p>`;
  else lessonCard = `<div class="wk">${t("week", cur.week_no)}</div><p style="margin:0">${t("soon")}</p>`;
  render(`
    <h1>${esc(t("hello", m.name ? m.name.split(" ")[0] : ""))}</h1>
    <div class="card lesson-now"><h2>${t("your_lesson")}</h2>${lessonCard}</div>
    <div class="card hero"><h2>${t("month", monthOf(tm.period))}</h2>
      <div class="big">${sats(tm.sats)} <span style="font-size:18px;font-weight:700">${t("earned")}</span></div>
      <div class="bar">${Array.from({ length: tm.max_weeks }, (_, i) => `<i class="${i < tm.paid_weeks ? "on" : ""}"></i>`).join("")}</div>
      <div style="font-weight:600">${t("of_max", tm.paid_weeks, tm.max_weeks, sats(tm.max_weeks * tm.sats_per_week))}</div>
      <div style="font-size:15px">${t("payday", day(tm.pay_date))}</div></div>
    <div class="card"><h2>${t("progress")}</h2><div style="font-weight:700">${t("weeks_of", m.done_count, m.total_weeks)}</div>
      <div class="dots">${m.weeks.map(w => `<span class="${w.state === "done" ? "done" : w.state === "ready" ? "now" : ""}">${w.week_no}</span>`).join("")}</div></div>
    <nav class="menu"><a href="#/weeks">${t("all")}<span>›</span></a><a href="#/money">${t("money")}<span>›</span></a><a href="#/me">${t("settings")}<span>›</span></a></nav>`);
}

async function weeks() {
  let m; try { m = await loadMe(true); } catch (e) { return; }
  const label = { done: ["s_done", "p-good"], ready: ["s_ready", "p-or"], wait: ["s_wait", ""], soon: ["s_soon", ""], locked: ["s_locked", ""] };
  render(`<h1>${t("all")}</h1><div class="list">${m.weeks.map(w => {
      const open = w.state === "done" || w.state === "ready";
      const tag = open ? "a" : "div";
      return `<${tag} class="item ${w.state}" ${open ? `href="#/lesson/${w.week_no}"` : ""}><span class="n">${w.week_no}</span>
        <div class="m"><b>${esc(w.title || t("week", w.week_no))}</b>${w.completed_on ? `<small>${day(w.completed_on)} · ${w.score}/${w.total}</small>` : w.state === "wait" ? `<small>${day(w.opens_on)}</small>` : ""}</div>
        <span class="pill ${label[w.state][1]}">${t(label[w.state][0])}</span></${tag}>`;
    }).join("")}</div>`, "#/");
}

/* ---------- lesson reader: one page at a time, then the quiz */
// Practice mode lives under #/demo: same lesson and quiz screens, no sign-in, nothing saved.
const isDemo = () => location.hash.startsWith("#/demo");
const H = () => isDemo() ? "#/demo" : "#";
const lessonUrl = week => isDemo() ? `/api/learn/demo/lessons/${week}` : `/api/learn/lessons/${week}`;
const demoNote = () => isDemo() ? `<div class="note">🧪 ${t("demo_note")}</div>` : "";
async function demoHome() {
  let d; try { d = await call("GET", "/api/learn/demo"); } catch (e) { d = { weeks: [] }; }
  render(`<h1>${t("demo_title")}</h1>${demoNote()}<p>${t("demo_pick")}</p>
    ${d.weeks.length ? `<div class="list">${d.weeks.map(w => `<a class="item ready" href="#/demo/lesson/${w.week_no}"><span class="n">${w.week_no}</span><div class="m"><b>${esc(w.title)}</b><small>${t("week", w.week_no)}</small></div><span class="pill p-or">${t("start")}</span></a>`).join("")}</div>` : `<p class="muted">${t("demo_none")}</p>`}
    <a class="btn ghost" href="#/">${t("demo_back")}</a>`, "#/");
}
async function lesson(week, pageNo) {
  let l;
  try { l = await call("GET", lessonUrl(week)); } catch (e) { return fail(e); }
  const pages = window.lessonPages(l.body);
  const n = Math.min(Math.max(Number(pageNo) || 1, 1), pages.length || 1);
  const last = n >= pages.length;
  let footer;
  const h = H();
  if (!last) footer = `<div class="row">${n > 1 ? `<a class="btn ghost" href="${h}/lesson/${week}/${n - 1}">‹ ${t("prev")}</a>` : ""}<a class="btn" href="${h}/lesson/${week}/${n + 1}">${t("next")} ›</a></div>`;
  else if (l.state === "done") footer = `<div class="row">${n > 1 ? `<a class="btn ghost" href="${h}/lesson/${week}/${n - 1}">‹ ${t("prev")}</a>` : ""}<a class="btn" href="#/">${t("go_home")}</a></div>`;
  else footer = `<div class="row">${n > 1 ? `<a class="btn ghost" href="${h}/lesson/${week}/${n - 1}">‹</a>` : ""}<button class="btn" id="readdone" style="flex:3">${t("done_reading")} ✓</button></div>`;
  render(`${demoNote()}
    <div class="pageno">${t("week", week)} · ${t("page", n, pages.length)}</div>
    <div class="prog"><i style="width:${Math.round(n / pages.length * 100)}%"></i></div>
    <h1 style="font-size:20px">${esc(l.title)}</h1>
    <article class="page">${pages[n - 1] || ""}</article>
    ${footer}`, isDemo() ? "#/demo" : "#/");
  $("#readdone")?.addEventListener("click", async e => {
    e.target.disabled = true;
    if (isDemo()) { location.hash = `#/demo/quiz/${week}`; return; }
    try { await call("POST", `/api/learn/lessons/${week}/read`, {}); location.hash = `#/quiz/${week}`; }
    catch (err) { toast(err.message, true); e.target.disabled = false; }
  });
}

/* ---------- quiz: the server picks the questions and marks them */
let quizState = null;
async function quizIntro(week) {
  let l; try { l = await call("GET", lessonUrl(week)); } catch (e) { return fail(e); }
  if (l.state === "done") { location.hash = "#/"; return; }
  if (!l.read_done) { render(`<div class="note">${t("read_first")}</div><a class="btn" href="#/lesson/${week}">${t("start")}</a>`, "#/"); return; }
  render(`${demoNote()}<div class="pageno">${t("week", week)}</div><h1>${esc(l.title)}</h1>
    <div class="card"><p style="margin:0 0 16px;font-weight:600">${t("quiz_intro", l.questions, l.pass_correct)}</p>
    <button class="btn" id="go">${t("quiz_start")}</button></div>
    <a class="btn ghost" href="${H()}/lesson/${week}">${t("read_again")}</a>`, isDemo() ? "#/demo" : "#/");
  $("#go").addEventListener("click", async e => {
    e.target.disabled = true;
    try { const q = await call("POST", `${lessonUrl(week)}/quiz`, {}); quizState = { ...q, answers: q.questions.map(() => null), i: 0 }; question(); }
    catch (err) { toast(err.message, true); e.target.disabled = false; }
  });
}
function question() {
  const s = quizState, q = s.questions[s.i], lastQ = s.i === s.questions.length - 1;
  render(`${demoNote()}<div class="pageno">${t("question", s.i + 1, s.questions.length)}</div>
    <div class="prog"><i style="width:${Math.round((s.i + 1) / s.questions.length * 100)}%"></i></div>
    <div class="card"><p class="qtext">${esc(q.question)}</p>
      <div role="radiogroup" aria-label="${esc(t("choose_one"))}">${q.choices.map((c, j) => `<button type="button" class="choice" role="radio" aria-checked="${s.answers[s.i] === j}" data-j="${j}"><span class="dot"></span><span>${esc(c)}</span></button>`).join("")}</div></div>
    <div class="row">${s.i > 0 ? `<button class="btn ghost" id="qprev">‹</button>` : ""}<button class="btn" id="qnext" style="flex:3" ${s.answers[s.i] == null ? "disabled" : ""}>${lastQ ? t("send") : t("next") + " ›"}</button></div>`, "#/");
  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
    s.answers[s.i] = Number(b.dataset.j);
    document.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-checked", x === b)); $("#qnext").disabled = false;
  }));
  $("#qprev")?.addEventListener("click", () => { s.i--; question(); });
  $("#qnext").addEventListener("click", async e => {
    if (!lastQ) { s.i++; return question(); }
    e.target.disabled = true;
    try { result(await call("POST", `${s.demo ? "/api/learn/demo" : "/api/learn"}/quiz/${s.attempt_id}`, { answers: s.answers })); }
    catch (err) { toast(err.message, true); e.target.disabled = false; }
  });
}
function result(r) {
  const s = quizState; quizState = null; me = null;
  const list = `<div class="card">${s.questions.map((q, i) => { const x = r.results[i]; return `<div class="res"><span class="ic ${x.correct ? "ok" : "no"}">${x.correct ? "✓" : "✗"}</span>
      <div><b>${esc(q.question)}</b><div class="muted">${x.correct ? t("right") : t("wrong")}${"answer" in x && !x.correct ? ` · ${t("right_ans")} ${esc(q.choices[x.answer])}` : ""}</div></div></div>`; }).join("")}</div>`;
  const home = r.demo ? `<a class="btn" href="#/demo">${t("demo_title")}</a><a class="btn ghost" href="#/">${t("demo_back")}</a>` : `<a class="btn" href="#/">${t("go_home")}</a>`;
  if (r.passed) render(`<div class="card center"><div class="celebrate">🎉</div><h1>${t("passed")}</h1>
      <p style="font-weight:600">${r.demo ? t("demo_passed") : r.newly_done && r.pay_period && r.added_sats ? t("passed_sub", monthOf(r.pay_period.period), sats(r.added_sats)) : r.newly_done ? t("week_done") : t("passed_again")}</p>
      <p class="muted" style="margin:0">${r.score} / ${r.total}</p></div>${list}${home}`);
  else render(`<div class="card center"><h1>${t("failed")}</h1><p style="margin:0">${t("failed_sub", r.score, r.total, r.need)}</p></div>${list}
      <div class="row"><a class="btn ghost" href="${r.demo ? "#/demo" : "#"}/lesson/${s.week_no}">${t("read_again")}</a><button class="btn" id="again">${t("try_again")}</button></div>`);
  $("#again")?.addEventListener("click", () => quizIntro(s.week_no));
}

/* ---------- money */
async function money() {
  let m, rows;
  try { [m, rows] = await Promise.all([loadMe(true), call("GET", "/api/learn/payouts")]); } catch (e) { return; }
  const st = s => s === "paid" ? [t("st_paid"), "p-good"] : s === "failed" ? [t("st_failed"), "p-bad"] : [t("st_wait"), "p-or"];
  render(`<h1>${t("money")}</h1>
    <div class="card"><h2>${t("ln")}</h2>${m.lightning_address ? `<div class="mono" style="font-weight:700">${esc(m.lightning_address)}</div>` : `<div class="err" style="margin:0">${t("ln_none")}</div>`}
      <p class="muted" style="margin:8px 0 0;font-size:15px">${t("ln_help")}</p></div>
    <div class="card hero"><h2>${t("month", monthOf(m.this_month.period))}</h2><div class="big">${sats(m.this_month.sats)} <span style="font-size:18px">sats</span></div>
      <div style="font-size:15px">${t("payday", day(m.this_month.pay_date))}</div>
      <div style="font-size:14px;margin-top:6px">${t("after_cut", day(m.this_month.counts_until))}</div></div>
    <h2 style="font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">${t("payouts")}</h2>
    <div class="list">${rows.length ? rows.map(r => { const [l, c] = st(r.status); return `<div class="item"><div class="m"><b>${sats(r.amount_sats)} sats</b>
      <small>${r.period ? monthOf(r.period) + " " + r.period.slice(0, 4) : ""}${r.weeks_earned != null ? " · " + t("weeks_n", r.weeks_earned) : ""}${r.paid_at ? " · " + day(r.paid_at.slice(0, 10)) : ""}</small></div>
      <span class="pill ${c}">${l}</span></div>`; }).join("") : `<div class="item"><div class="m muted">${t("no_payouts")}</div></div>`}</div>`, "#/");
}

/* ---------- settings */
async function settingsPage() {
  let m; try { m = await loadMe(); } catch (e) { return; }
  render(`<h1>${t("settings")}</h1>
    <div class="card"><b>${esc(m.name || "")}</b><div class="muted">${m.shacks.map(n => t("shack", n)).join(", ")}</div></div>
    <form class="card" id="pinf"><h2>${t("change_pin")}</h2>
      <label class="f">${t("cur_pin")}<input class="pin" type="password" name="current" inputmode="numeric" maxlength="6" required autocomplete="current-password"></label>
      <label class="f">${t("new_pin")}<input class="pin" type="password" name="next" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="new-password"></label>
      <button class="btn dark" type="submit">${t("save")}</button></form>
    <button class="btn ghost" id="out">${t("signout")}</button>`, "#/");
  $("#pinf").addEventListener("submit", async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try { await call("POST", "/api/learn/pin", { current: f.get("current"), next: f.get("next") }); e.target.reset(); toast(t("saved")); }
    catch (err) { toast(err.message, true); }
  });
  $("#out").addEventListener("click", async () => { try { await call("POST", "/api/learn/logout", {}); } catch (e) {} me = null; await forgetSaved(); loginView(); });
}

// On sign-out, remove lessons and progress saved on this phone (it may be shared).
async function forgetSaved() {
  try { for (const k of await caches.keys()) { const c = await caches.open(k); for (const r of await c.keys()) if (new URL(r.url).pathname.startsWith("/api/")) await c.delete(r); } } catch (e) {}
}

/* ============================================================ router */
function route() {
  document.documentElement.lang = lang;
  const [page, a, b, c] = (location.hash.slice(2) || "").split("/");
  if (page === "demo") {
    if (a === "lesson") return lesson(Number(b), c);
    if (a === "quiz") return quizState && quizState.demo && quizState.week_no === Number(b) ? question() : quizIntro(Number(b));
    return demoHome();
  }
  if (page === "lesson") return lesson(Number(a), b);
  if (page === "quiz") return quizState && quizState.week_no === Number(a) ? question() : quizIntro(Number(a));
  if (page === "weeks") return weeks();
  if (page === "money") return money();
  if (page === "me") return settingsPage();
  return home();
}
window.addEventListener("hashchange", route);
route();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
